<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex, nofollow"><meta name="workeros-acceso" content="https://manchas-opticanissi-n8n.wxeafs.easypanel.host/webhook/workeros/acceso">
<title>WorkerOS Nissitech</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: panel de operación. Barra lateral fija con las secciones, área de trabajo a la derecha;
   en el editor, formulario a la izquierda y vista previa de WhatsApp pegada a la derecha. */
:root {
  /* Blanco con tonos azules (pedido de Mari). Un solo tema claro. */
  --bg: #F3F6FB;
  --surface: #FFFFFF;
  --surface-2: #F6F9FE;
  --ink: #0D1F40;
  --muted: #5B6B89;
  --line: #DBE3F0;
  --accent: #1D5BD8;
  --accent-strong: #123F9E;
  --accent-soft: #E6EEFD;
  --accent-ink: #FFFFFF;
  --ok: #0C8459;
  --ok-soft: #DDF3EA;
  --warn: #9A6400;
  --warn-soft: #FCF1DA;
  --bad: #C0322F;
  --bad-soft: #FCE6E5;
  --idle: #64708A;
  --idle-soft: #EDF1F7;
  --chat-bg: #E8EEF7;
  --bubble-in: #FFFFFF;
  --bubble-out: #D7E6FF;
  --shadow: 0 1px 2px rgba(13,31,64,.05), 0 8px 24px rgba(29,91,216,.08);
  --f-display: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.5; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -.01em; }
h1 { font-size: 26px; font-weight: 700; }
h2 { font-size: 18px; font-weight: 600; }
h3 { font-size: 15px; font-weight: 600; }
p { margin: 0; }
a { color: var(--accent); }
code, .mono { font-family: var(--f-mono); font-size: 12.5px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.app { display: grid; grid-template-columns: 228px minmax(0, 1fr); min-height: 100%; }
.side { background: var(--surface); border-right: 1px solid var(--line); padding-block: 20px; padding-inline: 14px; display: flex; flex-direction: column; gap: 22px; position: sticky; top: 0; height: 100vh; }
.brand { display: flex; align-items: center; gap: 10px; padding-inline: 6px; }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: var(--f-mono); font-weight: 500; font-size: 12px; }
.brand-name { font-family: var(--f-display); font-weight: 700; font-size: 18px; line-height: 1; }
.brand-sub { font-size: 11px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; border-radius: 8px; text-decoration: none; color: var(--muted); font-weight: 500; }
.nav a:hover { background: var(--surface-2); color: var(--ink); }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.nav .count { font-family: var(--f-mono); font-size: 11px; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding-inline: 6px; }
.mode-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); text-decoration: none; color: var(--ink); width: fit-content; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--idle); flex: none; }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }

.main { padding-block: 28px 64px; padding-inline: clamp(16px, 3vw, 40px); min-width: 0; }
.view-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 20px; margin-bottom: 20px; }
.view-head p { color: var(--muted); max-width: 62ch; margin-top: 4px; }
.eyebrow { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 500; text-decoration: none; color: var(--ink); white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); background: var(--surface-2); }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 5px 10px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

/* Entrada con usuario y contraseña (solo en la versión publicada) */
.login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: radial-gradient(1200px 500px at 50% -10%, var(--accent-soft), transparent 70%), var(--bg); }
.login-card { width: min(400px, 100%); padding: 28px 26px 24px; display: flex; flex-direction: column; gap: 16px; box-shadow: var(--shadow); }
.login-card h1 { font-family: var(--f-display); font-size: 24px; margin: 6px 0 0; }
.login-card p { margin: 0; color: var(--muted); font-size: 14px; }
.login-card .btn.primary { justify-content: center; padding-block: 11px; font-size: 15px; }
.login-foot { font-size: 12px; color: var(--muted); text-align: center; }
.side-user { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.notice { display: flex; gap: 10px; padding: 12px 14px; border-radius: var(--r); background: var(--warn-soft); color: var(--ink); font-size: 13px; }
.notice.info { background: var(--accent-soft); }
.notice.ok { background: var(--ok-soft); }
.notice.bad { background: var(--bad-soft); }
.notice b { font-weight: 600; }
.notice ul { margin: 6px 0 0; padding-left: 18px; }

/* Resumen */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 18px; }
.stat { padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.stat .n { font-family: var(--f-display); font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat .l { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }

.toolbar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin-bottom: 14px; }
.search { flex: 1 1 220px; min-width: 0; display: flex; }
.search input { width: 100%; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 6px 11px; cursor: pointer; color: var(--muted); font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: 12.5px; cursor: pointer; color: var(--muted); }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.lbl { font-size: 12px; color: var(--muted); }

.group { margin-top: 18px; }
.group-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
.group-head .mono { color: var(--muted); }
.wlist { display: flex; flex-direction: column; overflow: hidden; }
.wrow { display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(0, 1.3fr) minmax(0, 1.4fr) auto; gap: 14px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line); }
.wrow:first-child { border-top: 0; }
.wrow:hover { background: var(--surface-2); }
.wname { display: flex; flex-direction: column; min-width: 0; }
.wname b { font-weight: 600; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wname span { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mods { display: flex; flex-wrap: wrap; gap: 4px; }
.mod { font-family: var(--f-mono); font-size: 11px; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); }
.mod.off { opacity: .45; border-style: dashed; }
.state { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; padding: 3px 9px; border-radius: 999px; width: fit-content; }
.state.borrador { background: var(--idle-soft); color: var(--idle); }
.state.creado { background: var(--accent-soft); color: var(--accent); }
.state.activo { background: var(--ok-soft); color: var(--ok); }
.state.error { background: var(--bad-soft); color: var(--bad); }
.tag { font-size: 11px; color: var(--muted); border: 1px dashed var(--line); padding: 0 6px; border-radius: 4px; }
.wmeta { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.wactions { display: flex; gap: 4px; justify-content: flex-end; flex-wrap: wrap; }
.empty { padding: 36px 20px; text-align: center; color: var(--muted); display: flex; flex-direction: column; gap: 10px; align-items: center; }

/* Editor */
.editor { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 22px; align-items: start; }
.steps { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.steps a { font-size: 12.5px; text-decoration: none; color: var(--muted); padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); }
.steps a:hover { color: var(--ink); }
.steps a .mono { font-size: 11px; margin-right: 4px; color: var(--accent); }
.fsec { padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; scroll-margin-top: 16px; }
.fsec + .fsec { margin-top: 14px; }
.fsec-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.fsec-head p { color: var(--muted); font-size: 13px; margin-top: 2px; max-width: 60ch; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > label, .field > .flabel { font-weight: 500; font-size: 13px; display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.field .req { color: var(--bad); }
.hint { font-size: 12px; color: var(--muted); }
.hint .mono { font-size: 11.5px; }
input[type="text"], input[type="password"], input[type="url"], input[type="email"], input[type="number"], select, textarea {
  border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 8px 10px; width: 100%; min-width: 0;
}
textarea { resize: vertical; min-height: 64px; line-height: 1.45; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 3px var(--accent-soft); }
.invalid input, .invalid textarea, .invalid select { border-color: var(--bad); }
.ferr { color: var(--bad); font-size: 12px; }
.vars { display: flex; gap: 4px; flex-wrap: wrap; }
.vars button { font-family: var(--f-mono); font-size: 11px; border: 1px solid var(--line); background: var(--surface); padding: 1px 6px; border-radius: 4px; cursor: pointer; color: var(--accent); }
.days { display: flex; gap: 4px; flex-wrap: wrap; }
.days button { width: 36px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; font-weight: 600; color: var(--muted); }
.days button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tpick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tpick label { border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; background: var(--surface-2); }
.tpick label:has(input:checked) { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); background: var(--surface); }
.tpick label.fija, .tpick label.fija:has(input:checked) { cursor: default; box-shadow: none; border-color: var(--line); background: var(--surface); }
.tp-top .fx { margin-left: auto; font-size: 11px; color: var(--muted); background: var(--idle-soft); padding: 1px 7px; border-radius: 999px; white-space: nowrap; }
.tp-top { display: flex; align-items: center; gap: 8px; }
.tp-top input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); flex: none; }
.tp-top .code { font-family: var(--f-mono); font-size: 12px; font-weight: 500; color: var(--accent-strong); background: var(--accent-soft); padding: 1px 6px; border-radius: 5px; }
.tp-top b { font-weight: 600; }
.tp-top .hint { margin-left: auto; }
.tpick ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: 13px; display: flex; flex-direction: column; gap: 2px; }
.presets { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
@media (max-width: 760px) { .tpick { grid-template-columns: minmax(0, 1fr); } }
.kinds { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.kind { border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 8px; background: var(--surface-2); cursor: pointer; }
.kind:has(input:checked) { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); background: var(--surface); }
.kind.soon { cursor: default; opacity: .65; }
.kind-top { display: flex; align-items: center; gap: 8px; }
.kind-top input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); flex: none; }
.kind-top b { font-weight: 600; }
.kind-top .fx { margin-left: auto; font-size: 11px; padding: 1px 7px; border-radius: 999px; white-space: nowrap; background: var(--accent-soft); color: var(--accent); }
.kind.soon .kind-top .fx { background: var(--idle-soft); color: var(--muted); }
.kind p { margin: 0; font-size: 13px; color: var(--muted); }
.kind-detail { border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; background: var(--surface); display: flex; flex-direction: column; gap: 8px; }
.kind-detail h3 { margin: 0; }
.feat { margin: 0; padding-left: 18px; columns: 2; column-gap: 24px; font-size: 13px; }
.feat li { break-inside: avoid; margin-bottom: 4px; }
.radio-col { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.radio-col label { display: flex; gap: 8px; align-items: flex-start; border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; cursor: pointer; background: var(--surface-2); }
.radio-col label:has(input:checked) { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); background: var(--surface); }
.radio-col input { margin: 3px 0 0; accent-color: var(--accent); flex: none; }
.radio-col b { display: block; font-weight: 600; font-size: 13px; }
@media (max-width: 900px) { .kinds { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 640px) { .radio-col { grid-template-columns: minmax(0, 1fr); } .feat { columns: 1; } }
.blk { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.blk.blk-bad { border-color: var(--bad); }
.blk-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.blk-head .code { font-family: var(--f-mono); font-size: 12px; font-weight: 500; color: var(--accent-strong); background: var(--accent-soft); padding: 2px 7px; border-radius: 5px; }
.blk-head h3 { margin: 0; }
.blk-item { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap: 8px; align-items: end; padding: 10px; border: 1px dashed var(--line); border-radius: 8px; }
.blk-item .wide { grid-column: 1 / 3; }
@media (max-width: 640px) { .blk-item { grid-template-columns: minmax(0, 1fr); } .blk-item .wide { grid-column: auto; } }
.chain { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; }
.switch { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 500; }
.switch input { appearance: none; width: 38px; height: 22px; border-radius: 999px; background: var(--line); position: relative; cursor: pointer; flex: none; margin: 0; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); transition: left .15s; }
.switch input:checked { background: var(--accent); }
.switch input:checked::after { left: 19px; }

.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; }
.opt.open { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent-soft); }
.opt.invalid { border-color: var(--bad); }
.opt-head { display: flex; align-items: center; gap: 4px; padding: 6px 8px 6px 4px; }
.opt-toggle { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; background: none; border: 0; text-align: left; cursor: pointer; padding: 6px 8px; border-radius: 8px; }
.opt-toggle:hover { background: var(--surface-2); }
.opt-title { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.opt-title.sin-titulo { color: var(--muted); font-weight: 400; font-style: italic; }
.badge { font-size: 11.5px; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.badge.asesor { background: var(--idle-soft); color: var(--idle); }
.chev { color: var(--muted); transition: transform .15s; flex: none; }
.opt.open .chev { transform: rotate(180deg); }
.opt .opt-body { padding: 14px 16px 16px; border-top: 1px solid var(--line); background: var(--surface-2); }
.menu-writer { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.menu-writer textarea { resize: vertical; white-space: pre-wrap; min-height: 260px; }
.menu-writer textarea { font-family: var(--f-mono); font-size: 13.5px; line-height: 1.7; min-height: 150px; }
.menu-count { font-size: 12px; color: var(--muted); }
.more summary { cursor: pointer; color: var(--accent); font-size: 13px; font-weight: 500; }
.more[open] summary { margin-bottom: 10px; }
.tuto { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 12px 14px; }
.tuto > summary { font-size: 14px; }
.tuto-intro { font-size: 13px; color: var(--muted); margin: 0 0 12px; }
.tuto-part { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 12px; }
.tuto-part:first-of-type { border-top: 0; margin-top: 0; padding-top: 0; }
.tuto-part h4 { margin: 0 0 4px; font-size: 14px; font-family: var(--f-display); color: var(--ink); }
.tuto-part h4 .tag { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); margin-left: 6px; vertical-align: 1px; }
.tuto-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; align-items: start; }
.tuto-grid > div:last-child { max-width: 440px; }
.tuto ol { margin: 6px 0 0; padding-left: 20px; font-size: 13px; line-height: 1.55; display: flex; flex-direction: column; gap: 5px; }
.tuto ol b { font-weight: 600; }
.tuto .warnline { font-size: 12.5px; color: var(--warn); background: var(--warn-soft); border-radius: 6px; padding: 6px 9px; margin-top: 8px; }
.shot { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #fff; font-size: 11px; color: var(--ink); box-shadow: var(--shadow); }
.shot .bar { display: flex; align-items: center; gap: 5px; padding: 6px 8px; background: var(--surface-2); border-bottom: 1px solid var(--line); }
.shot .bar i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); display: block; }
.shot .bar span { margin-left: 6px; font-family: var(--f-mono); font-size: 10px; color: var(--muted); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.shot .body { display: grid; grid-template-columns: 34% 1fr; min-height: 118px; }
.shot .sx { background: var(--surface-2); border-right: 1px solid var(--line); padding: 8px 6px; display: flex; flex-direction: column; gap: 4px; }
.shot .sx span { padding: 3px 6px; border-radius: 4px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.shot .sx span.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.shot .mx { padding: 9px 10px; display: flex; flex-direction: column; gap: 6px; }
.shot .mx .t { font-weight: 600; font-size: 12px; }
.shot .row { display: flex; flex-direction: column; gap: 2px; padding: 5px 6px; border-radius: 5px; border: 1px solid var(--line); }
.shot .row small { color: var(--muted); font-size: 10px; }

const fecha = (iso) => { try { return new Date(iso).toLocaleDateString('es', { day: 'numeric', month: 'short', year: 'numeric' }); } catch (e) { return ''; } };
const waFormat = (s) => esc(s)
  .replace(/\*([^*\n]+)\*/g, '<b>$1</b>')
  .replace(/(^|[\s(])_([^_\n]+)_/g, '$1<i>$2</i>')

function textoHorario(dias, desde, hasta) {
  const orden = DIAS.map(d => d[0]).filter(d => dias.includes(d));
  if (!orden.length) return '';
  const nom = (n) => DIAS.find(d => d[0] === n)[2];
  const idx = orden.map(n => DIAS.findIndex(d => d[0] === n));
  const seguidos = idx.every((v, i) => i === 0 || v === idx[i - 1] + 1);
  let d;
  if (orden.length === 1) d = nom(orden[0]);
  else if (orden.length === 7) d = 'todos los días';
  else if (seguidos && orden.length > 2) d = `${nom(orden[0])} a ${nom(orden[orden.length - 1])}`;
  else d = orden.slice(0, -1).map(nom).join(', ') + ' y ' + nom(orden[orden.length - 1]);
  return `${d}, de ${hora12(desde)} a ${hora12(hasta)}`;
}

    const m = l.match(/^(.+?)(?:\s*\(([^)]*)\))?\s*[:=]\s*(?:S\/|\$|US\$)?\s*([\d]+(?:[.,]\d+)?)\s*$/);
    if (!m) return null;

function campo(path, label, { tipo = 'text', ph = '', hint = '', req = false, rows = 3, vars = null, lista = false, full = false } = {}) {

  const input = tipo === 'textarea'
    ? `<textarea id="${idf}" data-path="${path}" ${lista ? 'data-lista="1"' : ''} rows="${rows}" placeholder="${esc(ph)}">${esc(val)}</textarea>`
    : `<input type="${tipo}" id="${idf}" data-path="${path}" ${lista ? 'data-lista="1"' : ''} value="${esc(val)}" placeholder="${esc(ph)}">`;
  return `<div class="field ${err ? 'invalid' : ''}" ${full ? 'style="grid-column:1/-1"' : ''}>

        <div class="fsec-head"><div><h2>Menú</h2><p>Primero escribe o pega el menú tal como lo verá el cliente. La web detecta las opciones numeradas y arma un desplegable para cada una, donde eliges qué hace${c._modelo ? '' : ' y pones su texto y su documento'}.${c._modelo ? ' El worker Florería lo muestra como una lista de WhatsApp: hasta 8 opciones, con títulos de hasta 24 letras.' : ''}</p></div></div>

            <li>Cada línea que empieza con número es una <b>opción</b> y crea su desplegable abajo.</li>

            <li>Una línea sin número debajo de una opción es su <b>descripción</b> (sale en cursiva).</li>

        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap"><h3>Respuestas de cada opción</h3><span class="menu-count" id="menuCount">${ops.length} ${ops.length === 1 ? 'opción' : 'opciones'}</span></div>
        <div class="opts" id="optsList">${vistaOpciones()}</div>
        ${vistaSueltos()}
      </section>

      <section class="fsec panel" id="${c._modelo ? 's-flor' : 's-bloques'}" ${oculto(4)}>
        ${c._modelo ? vistaFlor() : `<div class="fsec-head"><div><h2>Configurar plantillas</h2><p>Los datos que necesita cada plantilla que marcaste en el paso 2.</p></div></div>

      <section class="fsec panel" id="s-ia" ${oculto(5)}>
        ${vistaIA()}
      </section>

      <section class="fsec panel" id="s-mensajes" ${oculto(6)}>
        <div class="fsec-head"><div><h2>Mensajes</h2><p>Lo que dice el worker en cada momento. Las palabras entre llaves se reemplazan solas: <span class="mono">{nombre}</span> es el nombre del cliente en WhatsApp, <span class="mono">{negocio}</span> y <span class="mono">{asistente}</span> salen de la parte 1. Para negrita escribe *así*.</p></div></div>
        ${campo('p01.saludo', c._modelo ? 'Bienvenida' : 'Saludo', { tipo: 'textarea', vars: ['nombre', 'asistente', 'negocio'], ph: DEFAULTS.p01.saludo, hint: respaldo(DEFAULTS.p01.saludo) })}
        <div class="grid2">
          ${campo('p01.msg_opcion_invalida', 'Cuando no entiende la respuesta', { tipo: 'textarea', rows: 2, ph: DEFAULTS.p01.msg_opcion_invalida, hint: 'Después se repite el menú.' })}
          ${c._modelo ? campo('flor.msg_fuera_horario', 'Aviso fuera de horario', { tipo: 'textarea', rows: 2, ph: '🕘 Ahora estamos fuera de horario ({horario}), pero puedes dejar tu pedido y lo atendemos apenas abramos.', hint: 'Sale después de la bienvenida cuando escriben fuera del horario. Vacío = el de ejemplo.' }) : `<div class="field"><label for="f_max">Intentos antes de pasar a asesor</label><select id="f_max" data-num="p01.max_intentos_invalidos">${[2, 3, 4, 5].map(n => `<option value="${n}" ${n === Number(c.p01.max_intentos_invalidos) ? 'selected' : ''}>${n} respuestas que no entiende</option>`).join('')}</select><span class="hint">Si el cliente se equivoca esas veces seguidas, se le avisa que lo atenderá una persona.</span></div>`}
          ${campo('p01.msg_despedida', 'Despedida', { tipo: 'textarea', rows: 2, vars: ['nombre', 'negocio'], ph: DEFAULTS.p01.msg_despedida, hint: 'Cuando el cliente escribe "gracias", "chau"…' })}

          ${c._modelo ? '' : campo('p01.msg_archivo_no_soportado', 'Cuando mandan una foto o archivo', { tipo: 'textarea', rows: 2, ph: DEFAULTS.p01.msg_archivo_no_soportado, hint: 'Por ahora el worker solo lee texto.', full: true })}

      </section>

      <section class="fsec panel" id="s-asesor" ${oculto(7)}>
        <div class="fsec-head"><div><h2>Asesor y Chatwoot</h2><p>Cómo se avisa al cliente que lo atenderá una persona y dónde lo atiende. Con Chatwoot, el asesor lee y responde la conversación desde ahí.</p></div></div>
        <div class="grid2">
          ${campo('p12.nombre_asesor', 'Cómo llamar al asesor', { ph: DEFAULTS.p12.nombre_asesor, hint: 'Se usa en <span class="mono">{asesor}</span>. Ej: "nuestro equipo", "Carla".' })}

          ${campo('p12.msg_fuera_horario', 'Aviso fuera del horario', { tipo: 'textarea', vars: ['asesor', 'horario'], ph: DEFAULTS.p12.msg_fuera_horario, hint: 'Se usa cuando escriben fuera del horario del paso 3.' })}
        </div>

        <label class="switch"><input type="checkbox" id="f_pausa" data-bool="interruptores.pausa" ${c.interruptores.pausa ? 'checked' : ''}>Modo pausa</label>

        ${c.interruptores.pausa ? campo('interruptores.mensaje_pausa', 'Mensaje de pausa', { tipo: 'textarea', rows: 2, ph: DEFAULTS.interruptores.mensaje_pausa }) : ''}
        <div class="field"><label for="f_ttl">Cuánto recuerda a cada cliente</label><select id="f_ttl" data-num="memoria.ttl_segundos">${[[86400, '1 día'], [259200, '3 días'], [604800, '7 días'], [1209600, '14 días'], [2592000, '30 días']].map(([s, l]) => `<option value="${s}" ${s === Number(c.memoria.ttl_segundos) ? 'selected' : ''}>${l}</option>`).join('')}</select><span class="hint">Pasado ese tiempo sin escribir, el cliente vuelve a recibir el saludo.</span></div>
      </section>
      <section class="fsec panel" id="s-revisar" ${oculto(8)}>
        <div class="fsec-head"><div><h2>Revisar y crear</h2><p>Así se va a crear el worker. Si algo no está bien, toca "Cambiar" y vuelves a ese paso.</p></div></div>
        ${vistaRevision()}
      </section>
      </form>

      <div class="sendbar panel" id="sendbar">
        <div class="left">${S.enviando ? '<span class="dot warn"></span>Enviando a n8n…' : `Paso ${S.paso + 1} de ${PASOS.length} · ${pasos()[S.paso][1]}`}</div>

          ${S.paso > 0 ? '<button type="button" class="btn" data-act="ant">Anterior</button>' : ''}

          ${S.paso < PASOS.length - 1 ? '<button type="button" class="btn primary" data-act="sig">Siguiente</button>'

        </div>
      </div>
      <div id="resultado">${pintarResultado()}</div>
    </div>
    ${vistaPreview()}
  </div>`;

  const v = sigDe(S.edit.config, code);
  return `<div class="field"><label for="f_${code}_sig">${label}</label><select id="f_${code}_sig" data-path="${code.toLowerCase()}.siguiente">${opts.map(([k, l]) => `<option value="${k}" ${k === v ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></div>`;
}

function hablar(txt) {
  const cfg = efectiva(S.edit.config), p01 = cfg.p01, ch = S.chat, mem = ch.mem;
  const h = new Date().toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' });
  ch.msgs.push({ yo: true, texto: txt, hora: h });
  const norm = (s) => String(s ?? '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9ñ ]/g, ' ').replace(/\s+/g, ' ').trim();
  const t = norm(txt);
  const contiene = (p) => { const w = norm(p); return w !== '' && (` ${t} `).includes(` ${w} `); };
  const rellenar = (s) => String(s ?? '').replace(/\s*\{nombre\}/g, ch.nombre ? ' ' + ch.nombre : '').replaceAll('{negocio}', cfg.negocio.nombre).replaceAll('{asistente}', cfg.negocio.nombre_asistente);
  const menu = p01.instruccion_menu + '\n\n' + p01.opciones.map(o => `*${o.numero}* ${o.titulo}` + (o.descripcion ? `\n      _${o.descripcion}_` : '')).join('\n\n');
  const bienvenida = rellenar(p01.saludo) + '\n\n' + menu;
  const derivar = (motivo) => {
    const pl = ch.dentro ? cfg.p12.msg_derivacion : cfg.p12.msg_fuera_horario;
    ch.msgs.push({ sys: true, texto: 'P12 · ' + motivo });
    mem.estado = mem.estado || 'en_menu'; mem.intentos = 0;
    return pl.replaceAll('{asesor}', cfg.p12.nombre_asesor).replaceAll('{horario}', cfg.horario.texto);
  };
  let r, doc = null;
  if (cfg.interruptores.pausa) r = cfg.interruptores.mensaje_pausa;
  else {
    const opciones = p01.opciones.map((o, i) => ({ ...o, numero: String(i + 1) }));
    const opcion = opciones.find(o => t === norm(o.numero) || (o.palabras || []).some(contiene));
    if ((cfg.p12.palabras_asesor || []).some(contiene)) r = derivar('pidió hablar con una persona');
    else if (mem.estado === '') { r = bienvenida; mem.estado = 'en_menu'; mem.intentos = 0; }
    else if (opcion && S.edit.config._modelo && tipoDe(opcion) === 'asesor') { mem.intentos = 0; r = derivar(`eligió la opción ${opcion.numero}`); }
    else if (opcion && S.edit.config._modelo && tipoDe(opcion) !== 'info') { mem.intentos = 0; if (texto(opcion.respuesta)) ch.msgs.push({ yo: false, texto: rellenar(opcion.respuesta), hora: h }); ch.msgs.push({ sys: true, texto: `Opción ${opcion.numero} · ${TIPOS_OPCION.find(([v]) => v === tipoDe(opcion))[1]}: desde aquí sigue el worker Florería en n8n` }); r = null; }
    else if (opcion && opcion.accion === 'modulo') { mem.intentos = 0; ch.msgs.push({ sys: true, texto: `${opcion.modulo} · ${BLOQUES[opcion.modulo]?.nombre || 'bloque'}: desde aquí responde el bloque en n8n` }); r = null; }
    else if (opcion) { mem.intentos = 0; if (opcion.accion !== 'asesor' && texto(opcion.archivo_url)) doc = texto(opcion.archivo_nombre) || 'Documento'; r = opcion.accion === 'asesor' ? derivar(`eligió la opción ${opcion.numero}`) : rellenar(doc ? opcion.respuesta : respuestaFinal(opcion)).trim() + p01.pie_respuesta; }
    else if ((p01.palabras_menu || []).some(contiene)) { r = bienvenida; mem.intentos = 0; }
    else if ((p01.palabras_despedida || []).some(contiene)) { r = rellenar(p01.msg_despedida); mem.estado = ''; mem.intentos = 0; }
    else if (bloquesUsados(S.edit.config).includes('P17') && S.edit.config.p17?.usar_como_respaldo !== false) { mem.intentos = 0; ch.msgs.push({ sys: true, texto: 'P17 · Agente IA: aquí la IA responde con la información del negocio y luego vuelve al menú' }); r = null; }
    else {
      mem.intentos++;
      if (p01.max_intentos_invalidos && mem.intentos >= p01.max_intentos_invalidos) r = derivar(`no entendió ${mem.intentos} veces`);
      else r = rellenar(p01.msg_opcion_invalida) + '\n\n' + menu;
    }
  }
  if (r !== null) ch.msgs.push({ yo: false, texto: doc ? r.replace(/^\s+/, '') : r, hora: h, doc });
}

function tipoDe(o) {
  if (TIPOS_OPCION.some(([v]) => v === o.tipo)) return o.tipo;
  if (o.accion === 'asesor' || pareceAsesor(o.titulo || '')) return 'asesor';
  const t = texto(o.titulo).toLowerCase();
  if (/mi pedido|estado|seguimiento|d[oó]nde est[aá]/.test(t)) return 'seguimiento';
  if (/cat[aá]logo|ramo|arreglo|flores|productos/.test(t)) return 'catalogo';
  if (/pedido|comprar|s[eé] qu[eé] quiero|c[oó]digo/.test(t)) return 'pedido';
  if (/pregunta|consulta libre/.test(t)) return 'ia';

}

/* Lo que se envía al Generador v0.8 para un worker fijo (camino "modelo"). Vacío = el modelo usa su respaldo. */
function armarModelo(w, cred) {
  const c = w.config, f = { ...FLOR_INICIAL(), ...(c.flor || {}) }, cw = { ...CW_INICIAL(), ...(c.cw || {}) }, ia = c.ia || IA_INICIAL();
  const limpio = (o) => { for (const k of Object.keys(o)) { if (isObj(o[k])) limpio(o[k]); if (vacio(o[k]) || (isObj(o[k]) && !Object.keys(o[k]).length)) delete o[k]; } return o; };
  const opciones = (c.p01.opciones || []).filter(o => texto(o.titulo)).map((o, i) => {
    const tipo = tipoDe(o), op = { numero: String(i + 1), titulo: texto(o.titulo), descripcion: texto(o.descripcion), tipo, palabras: (o.palabras || []).filter(Boolean) };
    if (['info', 'catalogo', 'pedido'].includes(tipo)) op.mensaje = texto(o.respuesta);
    if (['info', 'catalogo'].includes(tipo) && texto(o.archivo_url)) { op.archivo_url = linkDescarga(o.archivo_url); op.archivo_nombre = texto(o.archivo_nombre) || 'Documento.pdf'; }
    if (tipo === 'catalogo') op.categoria = texto(o.categoria);
    for (const k of Object.keys(op)) if (vacio(op[k])) delete op[k];
    return op;
  });
  const config = {
    worker_id: texto(c.worker_id),
    negocio: { nombre: texto(c.negocio.nombre), nombre_asistente: texto(c.negocio.nombre_asistente), zona_horaria: c.negocio.zona_horaria, moneda: texto(c.moneda) || 'S/' },
    whatsapp: { phone_number_id: texto(String(c.whatsapp.phone_number_id ?? '')) },
    horario: { dias: c.horario.dias, desde: Number(c.horario.desde), hasta: Number(c.horario.hasta), texto: texto(c.horario.texto) },
    interruptores: { pausa: !!c.interruptores.pausa, mensaje_pausa: texto(c.interruptores.mensaje_pausa) },
    memoria: { ttl_segundos: Number(c.memoria.ttl_segundos) },
    palabras: { menu: c.p01.palabras_menu || [], despedida: c.p01.palabras_despedida || [], asesor: c.p12.palabras_asesor || [] },
    menu: { titulo: texto(c.p01.instruccion_menu), opciones },
    mensajes: { bienvenida: texto(c.p01.saludo), fuera_horario: texto(f.msg_fuera_horario), no_entendi: texto(c.p01.msg_opcion_invalida), despedida: texto(c.p01.msg_despedida),
      derivacion: texto(c.p12.msg_derivacion), derivacion_fuera_horario: texto(c.p12.msg_fuera_horario) },
    catalogo: { fuente_url: texto(f.catalogo_url) },
    pedido: { turnos: lineasDe(f.turnos_texto), dias_entrega: f.dias_entrega || [] },
    delivery: { zonas: leerZonasFlor(f.zonas_texto).filter(Boolean) },
    pagos: { link_url: texto(f.pago_link), boton: texto(f.pago_boton) },
    equipo: { nombre_asesor: texto(c.p12.nombre_asesor), telefono_asesor: texto(f.telefono_asesor).replace(/[\s+-]/g, '') },
    registro: { sheet_url: texto(f.registro_url) },
    ia: { activa: ia.activa !== false, modelo: texto(ia.modelo) || 'gpt-4o-mini', instrucciones: texto(ia.instrucciones), conocimiento: texto(ia.conocimiento) }
  };
  if (cw.modo === 'existente') config.chatwoot = { activo: true, url: texto(cw.url).replace(/\/+$/, ''), account_id: texto(String(cw.account_id)), inbox_id: texto(String(cw.inbox_id)) };
  limpio(config);
  const out = { modelo: c._modelo, config, meta: { modelo: c._modelo, tipo_negocio: w.meta.tipo_negocio, etiquetas: w.meta.etiquetas || [], notas: w.meta.notas || '', origen: 'workeros-web', version_interfaz: '1.1' } };
  if (cred && cred.modo === 'nuevas') out.credenciales = { modo: 'nuevas', nombre: texto(cred.nombre), token_meta: texto(cred.token), app_id: texto(cred.app_id), app_secret: texto(cred.app_secret) };
  else out.credenciales = { modo: 'existentes' };
  if (texto(cred?.ia_key) && ia.activa !== false) out.credenciales.ia = { api_key: texto(cred.ia_key) };
  if (cw.modo === 'nueva') out.alta_chatwoot = { nombre: texto(cw.nombre) || texto(c.negocio.nombre), correo: texto(cw.correo).toLowerCase() };
  return out;
}

      <div class="field"><label for="cUrl">Dirección del Generador (webhook)</label>
        <input type="url" id="cUrl" value="${esc(a.url)}" placeholder="https://n8n.nissitech.cloud/webhook/workeros/crear-worker">
        <span class="hint">Está en n8n, en el primer nodo del workflow "WorkerOS · Generador" (Production URL). Para pruebas sirve la Test URL, que cambia <span class="mono">/webhook/</span> por <span class="mono">/webhook-test/</span>.</span></div>
      <div class="grid2">
        <div class="field"><label for="cHeader">Nombre del encabezado</label><input type="text" id="cHeader" value="${esc(a.header)}" placeholder="X-WorkerOS-Key"><span class="hint">Debe ser igual al "Name" de la credencial Header Auth del Generador.</span></div>
        <div class="field"><label for="cClave">Clave</label><input type="password" id="cClave" value="${esc(a.clave)}" placeholder="La clave secreta"><span class="hint">El "Value" de esa credencial. Se guarda solo en este navegador.</span></div>
      </div>
      <div class="field"><label for="cBase">Dirección de tu n8n (opcional)</label><input type="url" id="cBase" value="${esc(a.n8nBase)}" placeholder="https://n8n.nissitech.cloud"><span class="hint">Solo para armar los enlaces "Abrir en n8n" en modo simulado.</span></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button type="submit" class="btn primary">Guardar</button><button type="button" class="btn" data-act="probar">Probar conexión</button></div>
      <div id="connRes"></div>
    </form>
    <div style="display:flex;flex-direction:column;gap:14px;min-width:0">
      <div class="panel gloss">
        <div style="padding:14px 16px 6px"><h2>Palabras que aparecen aquí</h2></div>
        <details open><summary>API</summary><p>Una puerta para que un programa le pida cosas a otro. La API de n8n permite crear workflows sin entrar a n8n con el mouse. El Generador la usa por dentro.</p></details>
        <details><summary>Webhook</summary><p>Una dirección web que n8n "escucha". Cuando el formulario manda datos a esa dirección, el workflow arranca. Es como el buzón del Generador.</p></details>
        <details><summary>Clave y encabezado</summary><p>La clave es una contraseña que viaja con cada envío, en un campo llamado encabezado (header). Si no coincide con la del Generador, n8n rechaza el envío. Así nadie de afuera puede crear workers.</p></details>
        <details><summary>JSON</summary><p>Un formato de texto para ordenar datos con nombres y valores, como <span class="mono">"nombre": "Florería Demo"</span>. Es lo que viaja del formulario a n8n.</p></details>
        <details><summary>CORS</summary><p>Una regla de seguridad del navegador: una página solo puede hablar con otro sitio si ese sitio lo permite. En el webhook del Generador hay que poner en Options → Allowed Origins (CORS) la dirección de este panel.</p></details>
        <details><summary>Workflow y worker</summary><p>Un workflow es un flujo de nodos en n8n. Un worker es un workflow que atiende un WhatsApp, armado con plantillas.</p></details>
      </div>
      <div class="panel fsec">
        <h2>Cómo viaja un worker</h2>
        <div class="flow" style="gap:6px"><span class="mod">Formulario</span><span class="arrow">→</span><span class="mod">Generador (webhook)</span><span class="arrow">→</span><span class="mod">API de n8n</span><span class="arrow">→</span><span class="mod">Worker nuevo</span></div>
        <p class="hint">El Generador revisa los datos, los pone en el nodo CONFIG de la plantilla base, crea el worker apagado y responde con su id y enlace. Este panel guarda esa respuesta en la lista.</p>
      </div>
    </div>
  </div>`;
}
function montarConexion() {
  const f = $('#connForm');
  const leer = () => FIJA ? S.ajustes : Object.assign(S.ajustes, { url: $('#cUrl').value.trim(), header: $('#cHeader').value.trim() || 'X-WorkerOS-Key', clave: $('#cClave').value, n8nBase: $('#cBase').value.trim() });
  if (!FIJA) $$('[data-modo]', f).forEach(b => b.addEventListener('click', () => { leer(); S.ajustes.modo = b.dataset.modo; guardarAjustes(); render(); }));
  if (!FIJA) f.addEventListener('submit', (e) => { e.preventDefault(); leer(); guardarAjustes(); pintarModo(); toast('Conexión guardada'); });
  $('[data-act="probar"]', f).addEventListener('click', async () => {
    leer(); guardarAjustes(); pintarModo();
    const box = $('#connRes'); box.innerHTML = '<p class="hint">Probando…</p>';
    // Se envía un formulario vacío: si la clave y la dirección están bien, el Generador responde "faltan datos" (400) y no crea nada.
    const r = await enviar({}, { prueba: true });
    let html;
    if (r.status === 400 && r.data && r.data.ok === false) html = `<div class="notice ok"><div><b>${r.simulado ? 'Modo simulado: todo listo para probar.' : 'Conexión correcta.'}</b> ${r.simulado ? 'Cambia a "n8n real" cuando el Generador esté publicado.' : 'n8n recibió el envío y la clave es válida. No se creó ningún worker.'}</div></div>`;
    else { const l = leerRespuesta(r); html = `<div class="notice bad"><div><b>No funcionó.</b> ${esc(l.ok ? 'n8n respondió algo inesperado.' : l.errores[0])}</div></div>`; }
    box.innerHTML = html;
  });
}

/* ───────── Entrada ───────── */
function pintarLogin() {
  document.title = 'Entrar · WorkerOS';
  $('.app').outerHTML = `<div class="login-wrap"><form class="panel login-card" id="loginForm" novalidate>
    <div class="brand" style="padding:0"><div class="brand-mark" aria-hidden="true">W/</div><div><div class="brand-name">WorkerOS</div><div class="brand-sub">Nissitech</div></div></div>
    <div><h1>Entrar al panel</h1><p>Solo para el equipo de Nissitech. Aquí se crean los workers de WhatsApp.</p></div>
    <div class="field"><label for="lgUser">Usuario</label><input type="text" id="lgUser" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
    <div class="field"><label for="lgPass">Contraseña</label><input type="password" id="lgPass" autocomplete="current-password" required></div>
    <div id="lgMsg" role="alert"></div>
    <button type="submit" class="btn primary" id="lgBtn">Entrar</button>
    <p class="login-foot">¿Sin usuario? Pídelo a quien administra el n8n de Nissitech.</p>
  </form></div>`;
  const f = $('#loginForm'), msg = (t) => { $('#lgMsg').innerHTML = t ? `<div class="notice bad"><div>${esc(t)}</div></div>` : ''; };
  $('#lgUser').focus();
  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    const usuario = $('#lgUser').value.trim(), clave = $('#lgPass').value;
    if (!usuario || !clave) { msg('Escribe tu usuario y tu contraseña.'); return; }
    const b = $('#lgBtn'); b.disabled = true; b.textContent = 'Entrando…'; msg('');
    try {
      const r = await fetch(ACCESO, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ accion: 'entrar', usuario, clave }) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok || !d.ok || !d.token) { msg(r.status === 401 || d.ok === false ? 'Usuario o contraseña incorrectos.' : 'n8n respondió algo inesperado. Avisa a quien administra el panel.'); return; }
      const ses = { usuario: d.usuario || usuario, token: String(d.token), n8n: d.n8n || '', expira: Math.min(Number(d.expira) || Infinity, Date.now() + 12 * 3600 * 1000) };
      try { sessionStorage.setItem(CLAVE_SESION, JSON.stringify(ses)); } catch (err) { msg('Tu navegador no deja guardar la sesión. Prueba sin modo incógnito.'); return; }
      location.reload();
    } catch (err) { msg('No pude conectar con n8n. Revisa tu internet o que el flujo "WorkerOS · Acceso" esté activo.'); }
    finally { b.disabled = false; b.textContent = 'Entrar'; }
  });
}
function borrarSesion() { try { sessionStorage.removeItem(CLAVE_SESION); } catch (e) {} }
/* Salir: n8n anula el pase, así ya no sirve aunque alguien lo haya copiado */
function salir() {
  try { fetch(ACCESO, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ accion: 'salir', token: SESION.token }), keepalive: true }).catch(() => {}); } catch (e) {}
  borrarSesion(); location.hash = ''; location.reload();
}
function sesionVencida() { borrarSesion(); setTimeout(() => { location.hash = ''; location.reload(); }, 2500); }

/* ───────── Inicio ───────── */
if (ACCESO && !SESION) pintarLogin();
else {
  if (SESION) {
    const pie = $('.side-foot');
    pie.insertAdjacentHTML('afterbegin', `<div class="side-user"><span>Hola, <b>${esc(SESION.usuario)}</b></span><button type="button" class="btn sm ghost" id="btnSalir">Salir</button></div>`);
    $('#btnSalir').addEventListener('click', salir);
  }
  if (!store.get('workers', null)) guardarWorkers();
  render();
}
})();
</script>
</body></html>
